# Public commitments tracked by simchi.commitments. Statuses are computed (reports/commitments/
# status.json), never typed here. Each entry: who promised what, where it was published, the
# metric, how it is measured, and from which dataset or report. Sources read 2026-11-23.

[[commitment]]
id = "cta-frequent-network-scheduled"
agency = "Chicago Transit Authority"
quote = "Frequent Network bus routes provide service every 10 minutes or better between 6 a.m. and 9 p.m. on weekdays and 9 a.m. to 9 p.m. on weekends."
source = "https://www.transitchicago.com/frequent/"
metric = "share of Frequent Network route-direction-hours inside the service windows scheduled at 10 minutes or better"
measured = "CTA GTFS timetable: scheduled trips per route, direction, day type and hour (6 or more trips = 10 min or better)"
measured_from = "data/transit/service.json (GTFS extract, data/sources.toml gtfs_cta); routes and join dates data/frequent_network.toml"
rule = "frequent_scheduled"

[[commitment]]
id = "cta-frequent-network-delivered"
agency = "Chicago Transit Authority"
quote = "Frequent Network bus routes provide service every 10 minutes or better between 6 a.m. and 9 p.m. on weekdays and 9 a.m. to 9 p.m. on weekends."
source = "https://www.transitchicago.com/frequent/"
metric = "share of eligible Frequent Network route-direction-hours whose delivered headway (from polled positions) is 10 minutes or better"
measured = "CTA Bus Tracker positions polled about every 5 minutes, headways at the route's midpoint, against the same windows (W2)"
measured_from = "reports/reliability/frequent_network.json (polling archive, W2)"
rule = "frequent_delivered"

[[commitment]]
id = "vision-zero-zero-deaths-2026"
agency = "City of Chicago (Vision Zero Chicago)"
quote = "Vision Zero is Chicago's commitment to eliminating death and serious injury from traffic crashes by 2026."
source = "https://api.chicago.gov/filenet5/servlets/getDocumentContent?applicationId=CompleteStreets&documentId=%7B0031C690-0000-C016-92E9-31618D7320B1%7D"
source_title = "Vision Zero Chicago Action Plan 2017-2019 (published June 2017), PDF page 7"
metric = "traffic deaths in 2026"
measured = "count of Vision Zero fatality records with crash_date in 2026"
measured_from = "City of Chicago data portal gzaz-isa6 (Vision Zero Chicago Traffic Fatalities), aggregate count"
rule = "zero_by_year"
target_year = 2026
dataset = "gzaz-isa6"
count = "count(*)"
date_field = "crash_date"

[[commitment]]
id = "vision-zero-zero-serious-injuries-2026"
agency = "City of Chicago (Vision Zero Chicago)"
quote = "Vision Zero is Chicago's commitment to eliminating death and serious injury from traffic crashes by 2026."
source = "https://api.chicago.gov/filenet5/servlets/getDocumentContent?applicationId=CompleteStreets&documentId=%7B0031C690-0000-C016-92E9-31618D7320B1%7D"
source_title = "Vision Zero Chicago Action Plan 2017-2019 (published June 2017), PDF page 7"
metric = "people seriously (incapacitating) injured in traffic crashes in 2026"
measured = "sum of injuries_incapacitating over crash records with crash_date in 2026"
measured_from = "City of Chicago data portal 85ca-t3if (Traffic Crashes - Crashes), aggregate sum"
rule = "zero_by_year"
target_year = 2026
dataset = "85ca-t3if"
count = "sum(injuries_incapacitating)"
date_field = "crash_date"

[[commitment]]
id = "vision-zero-deaths-minus-20-by-2020"
agency = "City of Chicago (Vision Zero Chicago)"
quote = "Reduce deaths from traffic crashes 20% citywide by 2020."
source = "https://api.chicago.gov/filenet5/servlets/getDocumentContent?applicationId=CompleteStreets&documentId=%7B0031C690-0000-C016-92E9-31618D7320B1%7D"
source_title = "Vision Zero Chicago Action Plan 2017-2019, Action Plan Benchmarks, PDF pages 7 and 20"
metric = "traffic deaths in 2020 vs a baseline"
measured = "count of Vision Zero fatality records; the plan states no baseline year"
measured_from = "City of Chicago data portal gzaz-isa6"
rule = "reduction_vs_baseline"
reduction = 0.20
target_year = 2020
baseline_year = ""          # not stated in the source

[[commitment]]
id = "vision-zero-serious-injuries-minus-35-by-2020"
agency = "City of Chicago (Vision Zero Chicago)"
quote = "Reduce serious injuries from traffic crashes 35% by 2020."
source = "https://api.chicago.gov/filenet5/servlets/getDocumentContent?applicationId=CompleteStreets&documentId=%7B0031C690-0000-C016-92E9-31618D7320B1%7D"
source_title = "Vision Zero Chicago Action Plan 2017-2019, Action Plan Benchmarks, PDF pages 7 and 20"
metric = "serious injuries in 2020 vs a baseline"
measured = "sum of injuries_incapacitating; the plan states no baseline year"
measured_from = "City of Chicago data portal 85ca-t3if"
rule = "reduction_vs_baseline"
reduction = 0.35
target_year = 2020
baseline_year = ""

[[commitment]]
id = "vision-zero-high-crash-areas-minus-40-by-2020"
agency = "City of Chicago (Vision Zero Chicago)"
quote = "By 2020, Chicago will: Reduce severe crashes in High Crash Areas and High Crash Corridors by 40%."
source = "https://api.chicago.gov/filenet5/servlets/getDocumentContent?applicationId=CompleteStreets&documentId=%7B0031C690-0000-C016-92E9-31618D7320B1%7D"
source_title = "Vision Zero Chicago Action Plan 2017-2019, Goal 1, PDF page 27"
metric = "severe crashes in the plan's High Crash Areas and Corridors, 2020 vs a baseline"
measured = "needs the High Crash Area and Corridor boundaries and a baseline year"
measured_from = "not mirrored"
rule = "needs_unmirrored_data"
missing = "High Crash Area and High Crash Corridor boundaries (not mirrored); the plan states no baseline year"

[[commitment]]
id = "vision-zero-hardship-deaths-minus-25-by-2020"
agency = "City of Chicago (Vision Zero Chicago)"
quote = "By 2020, Chicago will: Reduce traffic crash fatalities for people living in high economic hardship communities by 25%."
source = "https://api.chicago.gov/filenet5/servlets/getDocumentContent?applicationId=CompleteStreets&documentId=%7B0031C690-0000-C016-92E9-31618D7320B1%7D"
source_title = "Vision Zero Chicago Action Plan 2017-2019, Goal 1, PDF page 27"
metric = "deaths of residents of high economic hardship communities, 2020 vs a baseline"
measured = "needs each victim's home community, which the public fatality data do not contain"
measured_from = "not available"
rule = "needs_unmirrored_data"
missing = "victims' home community (not in the public data); hardship classification; a baseline year"

# Corrections log: append only, never edit past entries.
