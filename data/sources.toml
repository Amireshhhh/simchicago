# Pinned data mirrors. Every run reads these local files; the sha256 is checked by
# `pytest tests/test_data.py` and by `python -m simchi.cli validate`.
#
# Descriptions state only what can be checked from the files themselves, plus the
# metadata recorded by SimChicago v0.1 in its exported run (quoted where used).

[cds_2021]
file = "data/raw/mirror/Chicago_2020.geojson"
sha256 = "a5a45960d35db35011d83982765be86816dd4bd01a01f2fb1334d0633eae66f3"
title = "CMAP Community Data Snapshots, Chicago community areas"
contents = "77 community-area MultiPolygons (WGS84) with 216 attributes: ACS population, age, race/ethnicity, households by size and type, income, education, labour force, commute mode and aggregate travel time, vehicles, housing, LEHD top-5 work/home destinations and industries, CMAP land use."
v01_metadata = "statistics CMAP CDS June 2021 (ACS 2015-2019, LEHD)"
geometry = "City of Chicago community-area boundaries"

[carjackings_2020]
file = "data/raw/mirror/Chi_Carjackings.geojson"
sha256 = "a6d0d96513212a54f86ce72b02e6d5b8791cc3c3fdea632357c196e787dcdcdc"
title = "Chicago Police Department reported vehicular hijackings, 2020"
contents = "1,412 Point records dated 2020 with IUCR 0325 (vehicular hijacking, 481 records) or 0326 (aggravated vehicular hijacking, 931 records); block-level locations, beat, district, ward, community area."
v01_metadata = "CPD reported incidents, IUCR 0325/0326 (vehicular hijacking), 2020; block-level, privacy-shifted"

[sdoh_tracts_2014]
file = "data/raw/mirror/Chi-SDOH.geojson"
sha256 = "d0dee6295c65dac76efe616c2ec5e62c79037627257069c9654a0e9b10f366bf"
title = "Chicago census-tract social determinants of health indicators (2014)"
contents = "791 census-tract (2010 TIGER) MultiPolygons with community area, 2014 population (Pop2014), poverty, vehicle availability (EP_NOVEH, NOCAR/CAR), transit commuting (CTA14P), commute time (CmTm14) and other 2014 indicators."

