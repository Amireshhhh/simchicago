name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 9 * * *"     # daily: refresh the reliability lens from the polled history
  workflow_dispatch:

permissions:
  contents: read
  actions: read            # list live.yml runs and download their vehicle-history artifacts
  pages: write
  id-token: write

# Shared with live.yml: the two workflows never deploy at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install simchi
        run: python -m pip install -e ".[test]"

      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Simulate (default week, comparison runs, experiments) and export
        run: python -m simchi.cli demo --replicates 5

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build and test viewer
        working-directory: viewer
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test

      - name: Reliability from the polled history (the latest 300 live.yml runs, about a day)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p hist
          for id in $(gh run list -R "$GITHUB_REPOSITORY" -w live.yml -s success -L 300 --json databaseId -q '.[].databaseId'); do
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n "vehicles-$id" -D "hist/vehicles-$id" || echo "no artifact for run $id"
          done
          python -m simchi.transit.reliability hist --out reliability-report --viewer viewer/dist/data/reliability.json
          cp reliability-report/summary.json viewer/dist/data/reliability_summary.json

      - name: Cache the built site for live.yml (without any live snapshot)
        uses: actions/cache/save@v6
        with:
          path: viewer/dist
          key: site-${{ github.sha }}

      - name: Restore the latest live snapshot, if any
        uses: actions/cache/restore@v6
        with:
          path: live/latest.json
          key: live-latest-none
          restore-keys: live-latest-

      - name: Add it to the site
        run: |
          if [ -f live/latest.json ]; then mkdir -p viewer/dist/live && cp live/latest.json viewer/dist/live/; fi

      - name: Scan the site for anything key-like
        run: python -m pytest -q -p no:cacheprovider tests/test_no_secrets.py

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
