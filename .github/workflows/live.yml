name: Live CTA snapshot

# Near-live CTA vehicle positions, polled server-side and published as a static snapshot.
# Budget and terms: docs/CTA_TERMS.md. Keys come only from the CTA_BUS_KEY / CTA_TRAIN_KEY
# secrets and are never written anywhere. Off the top of the hour, as GitHub recommends.
# GitHub's 5-minute schedule fired only a few times a day here, so the schedule is now an hourly
# restarter and each run queues the next one through workflow_dispatch (the job "next"): never sooner than
# 5 minutes after the previous run started, and only if no other run of this workflow is
# queued or running. The rate therefore stays at most one run per 5 minutes (288 a day), the
# budget in docs/CTA_TERMS.md (plus at most 24 hourly restarts: 312 runs a day at most). To stop the chain, set the repository variable LIVE_CHAIN to
# "off" (Settings -> Secrets and variables -> Actions -> Variables) or disable the workflow.
on:
  schedule:
    - cron: "17 * * * *"     # hourly restarter, in case the run-to-run chain below breaks
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write          # queue the next run (see the "next" job)

# Shared with pages.yml: the two workflows never deploy at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install simchi
        run: python -m pip install -e .

      - name: Poll CTA (3 polls, 60 s apart, capped per run)
        env:
          CTA_BUS_KEY: ${{ secrets.CTA_BUS_KEY }}
          CTA_TRAIN_KEY: ${{ secrets.CTA_TRAIN_KEY }}
        run: |
          if [ -n "$CTA_BUS_KEY" ]; then echo "::add-mask::$CTA_BUS_KEY"; fi
          if [ -n "$CTA_TRAIN_KEY" ]; then echo "::add-mask::$CTA_TRAIN_KEY"; fi
          python -m simchi.transit.live --polls 3 --interval 60 --out live

      - name: Operations view of the snapshot (holding advice, anomaly flags; no CTA requests)
        run: python -m simchi.ops.live_ops --snapshot live/latest.json --out live/ops.json || echo "ops view failed; snapshot published without it"

      - name: Keep this run's vehicle history (artifact, not git)
        uses: actions/upload-artifact@v7
        with:
          name: vehicles-${{ github.run_id }}
          path: |
            live/history.csv.gz
            live/requests.json
          retention-days: 14
          if-no-files-found: error

      - name: Remember the latest snapshot for pages.yml
        uses: actions/cache/save@v6
        with:
          path: |
            live/latest.json
            live/ops.json
          key: live-latest-${{ github.run_id }}

      - name: Restore the last built site
        id: site
        uses: actions/cache/restore@v6
        with:
          path: viewer/dist
          key: site-${{ github.sha }}
          restore-keys: site-

      - name: Stop if no site has been built yet
        if: steps.site.outputs.cache-matched-key == ''
        run: echo "No cached site yet; pages.yml must run once first. Snapshot kept as an artifact." && exit 0

      - name: Add the snapshot to the site
        if: steps.site.outputs.cache-matched-key != ''
        run: |
          mkdir -p viewer/dist/live
          cp live/latest.json viewer/dist/live/latest.json
          if [ -f live/ops.json ]; then cp live/ops.json viewer/dist/live/ops.json; fi

      - name: Scan the site and the snapshot for anything key-like
        if: steps.site.outputs.cache-matched-key != ''
        env:
          CTA_BUS_KEY: ${{ secrets.CTA_BUS_KEY }}
          CTA_TRAIN_KEY: ${{ secrets.CTA_TRAIN_KEY }}
          SIMCHI_LIVE_DIR: live
        run: |
          python -m pip install pytest
          python -m pytest -q -p no:cacheprovider tests/test_no_secrets.py

      - uses: actions/configure-pages@v6
        if: steps.site.outputs.cache-matched-key != ''

      - uses: actions/upload-pages-artifact@v5
        if: steps.site.outputs.cache-matched-key != ''
        with:
          path: viewer/dist

    outputs:
      deploy: ${{ steps.site.outputs.cache-matched-key != '' }}

  deploy:
    needs: poll
    if: needs.poll.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  next:
    needs: [poll, deploy]
    if: always() && vars.LIVE_CHAIN != 'off' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait until 5 minutes after this run started, then queue the next run
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -q .run_started_at)
          elapsed=$(( $(date -u +%s) - $(date -u -d "$started" +%s) ))
          wait=$(( 300 - elapsed ))
          if [ "$wait" -gt 0 ]; then echo "waiting ${wait}s"; sleep "$wait"; fi
          others=$(gh run list -R "$GITHUB_REPOSITORY" -w live.yml --json databaseId,status \
                   -q "[.[] | select(.databaseId != $GITHUB_RUN_ID) | select(.status == \"queued\" or .status == \"in_progress\" or .status == \"pending\" or .status == \"waiting\")] | length")
          if [ "$others" -gt 0 ]; then echo "another run is queued or running; not chaining"; exit 0; fi
          gh workflow run live.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "queued the next run"
