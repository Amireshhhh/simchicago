name: Live CTA snapshot

# Near-live CTA vehicle positions, polled server-side and published as a static snapshot.
# Budget and terms: docs/CTA_TERMS.md. Keys come only from the CTA_BUS_KEY / CTA_TRAIN_KEY
# secrets and are never written anywhere. Off the top of the hour, as GitHub recommends.
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with pages.yml: the two workflows never deploy at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install simchi
        run: python -m pip install -e .

      - name: Poll CTA (3 polls, 60 s apart, capped per run)
        env:
          CTA_BUS_KEY: ${{ secrets.CTA_BUS_KEY }}
          CTA_TRAIN_KEY: ${{ secrets.CTA_TRAIN_KEY }}
        run: |
          if [ -n "$CTA_BUS_KEY" ]; then echo "::add-mask::$CTA_BUS_KEY"; fi
          if [ -n "$CTA_TRAIN_KEY" ]; then echo "::add-mask::$CTA_TRAIN_KEY"; fi
          python -m simchi.transit.live --polls 3 --interval 60 --out live

      - name: Keep this run's vehicle history (artifact, not git)
        uses: actions/upload-artifact@v7
        with:
          name: vehicles-${{ github.run_id }}
          path: |
            live/history.csv.gz
            live/requests.json
          retention-days: 14
          if-no-files-found: error

      - name: Remember the latest snapshot for pages.yml
        uses: actions/cache/save@v6
        with:
          path: live/latest.json
          key: live-latest-${{ github.run_id }}

      - name: Restore the last built site
        id: site
        uses: actions/cache/restore@v6
        with:
          path: viewer/dist
          key: site-${{ github.sha }}
          restore-keys: site-

      - name: Stop if no site has been built yet
        if: steps.site.outputs.cache-matched-key == ''
        run: echo "No cached site yet; pages.yml must run once first. Snapshot kept as an artifact." && exit 0

      - name: Add the snapshot to the site
        if: steps.site.outputs.cache-matched-key != ''
        run: |
          mkdir -p viewer/dist/live
          cp live/latest.json viewer/dist/live/latest.json

      - name: Scan the site and the snapshot for anything key-like
        if: steps.site.outputs.cache-matched-key != ''
        env:
          CTA_BUS_KEY: ${{ secrets.CTA_BUS_KEY }}
          CTA_TRAIN_KEY: ${{ secrets.CTA_TRAIN_KEY }}
          SIMCHI_LIVE_DIR: live
        run: |
          python -m pip install pytest
          python -m pytest -q -p no:cacheprovider tests/test_no_secrets.py

      - uses: actions/configure-pages@v6
        if: steps.site.outputs.cache-matched-key != ''

      - uses: actions/upload-pages-artifact@v5
        if: steps.site.outputs.cache-matched-key != ''
        with:
          path: viewer/dist

    outputs:
      deploy: ${{ steps.site.outputs.cache-matched-key != '' }}

  deploy:
    needs: poll
    if: needs.poll.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
