name = "transit_disruption"
description = "What-if: transit trips take 50% longer, with and without commuters shifting away from transit."
replicates = 10
baseline = "normal service"

[build]
n = 2000
seed = 1

[base]
n_days = 7
incident_mode = "both"

[[scenario]]
name = "normal service"

[[scenario]]
name = "transit 1.5x slower"
set = { "time_multiplier.transit" = 1.5 }

[[scenario]]
name = "transit 1.5x slower, riders shift"
set = { "time_multiplier.transit" = 1.5, "mode_shift.transit" = -1.0 }
