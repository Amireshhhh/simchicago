name = "transit_disruption"
description = "What-if on the CTA network: slower vehicles, sparser service and higher fares. Riders respond through the network-based mode choice; no manual mode shift."
replicates = 10
baseline = "scheduled service"

[build]
n = 2000
seed = 1

[base]
n_days = 7
incident_mode = "both"

[[scenario]]
name = "scheduled service"

[[scenario]]
name = "bus and rail 1.5x slower"
set = { "network.ivt_multiplier.bus" = 1.5, "network.ivt_multiplier.rail" = 1.5 }

[[scenario]]
name = "half the frequency"
set = { "network.headway_multiplier.bus" = 2.0, "network.headway_multiplier.rail" = 2.0 }

[[scenario]]
name = "fares +$1"
set = { "network.fare_bus" = 3.25, "network.fare_rail" = 3.50 }
